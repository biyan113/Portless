[package]
name = "portless_core"
version = "0.1.0"
edition = "2021"
description = "Portless native core — ports, processes, local dev service management"
license = "MIT"

[lib]
name = "portless_core"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "portless_agent"
path = "src/bin/portless_agent.rs"

[[bin]]
name = "portless_app"
path = "src/bin/portless_app.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
once_cell = "1"
tiny_http = "0.12.0"
ureq = { version = "3.3.0", features = ["json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
